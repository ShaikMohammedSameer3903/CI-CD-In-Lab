name: Frontend CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: |
          if [ -f package.json ] && grep -q "lint" package.json; then npm run lint; else echo "no lint script"; fi

      - name: Run tests
        run: |
          if [ -f package.json ] && grep -q "test" package.json; then npm test -- --watchAll=false || true; else echo "no test script"; fi

      - name: Build
        env:
          VITE_BASE: '/ShaikMohammedSameer3903/CI-CD-In-Lab/'
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
